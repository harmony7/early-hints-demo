authors = []
description = "103 Early Hints デモ: マニフェスト型(バックエンドが資材の一覧を公開)"
language = "javascript"
manifest_version = 3
name = "pattern-c-manifest"
service_id = ""

[scripts]
build = "npm run build"

# デプロイ時に `fastly compute publish` が聞いてくる項目の既定値。
# address は mock-origin-compute をデプロイして得たドメインに置き換える。
[setup]

[setup.backends]

[setup.backends.origin]
description = "think time を持つ擬似オリジン(mock-origin-compute)"
address = "REPLACE-ME.edgecompute.app"
port = 443

# ローカルの `fastly compute serve` 用。
# mock-origin-compute を 127.0.0.1:8080 で起動しておく。
# ただし Viceroy は 103 をクライアントに送らないので、
# ローカルではブラウザで効果は見えない(README 参照)。
[local_server]

[local_server.backends]

[local_server.backends.origin]
url = "http://127.0.0.1:8080"
override_host = "127.0.0.1:8080"
